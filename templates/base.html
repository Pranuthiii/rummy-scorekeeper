<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Rummy Royale{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="blobs blob-a"></div><div class="blobs blob-b"></div>
  <nav class="nav">
    <a class="brand" href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}">
      <span class="brand-card">🃏</span> Rummy Royale
    </a>
    {% if session.get('user_id') %}
      <div class="nav-right">
        <span class="welcome">Hi, {{ session['username'] }} ✨</span>
        <a class="nav-btn" href="{{ url_for('dashboard') }}">Dashboard</a>
        <a class="nav-btn" href="{{ url_for('logout') }}">Log out</a>
      </div>
    {% endif %}
  </nav>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
